<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <!-- icon.svg, animated. Shapes are the shipped icon verbatim; the motion is
       the one on federico.baldan.dev. The tile stays still, only the mark moves:
       a light packet runs the orbit, faces and edge highlights pulse in
       sequence, the sparkle twinkles.

       Periods are 3.6s and 5.4s so the whole thing repeats every 10.8s — that
       is what lets icon-animated.webp (rendered from this file) loop without a
       seam. Keep any new period a divisor of 10.8s. -->
  <style>
    .amb{transform-box:fill-box;transform-origin:center;animation:amb 5.4s ease-in-out infinite}
    @keyframes amb{0%,100%{opacity:.72;transform:scale(.94)}50%{opacity:1;transform:scale(1.08)}}

    .orbit-run{
      fill:none;stroke:#f6efff;stroke-width:3.2;stroke-linecap:round;
      stroke-dasharray:10 84;opacity:0;animation:run 3.6s linear infinite;
    }
    @keyframes run{
      0%{opacity:0;stroke-dashoffset:94}
      12%,88%{opacity:1}
      100%{opacity:0;stroke-dashoffset:0}
    }

    .face{animation:face 5.4s ease-in-out infinite backwards}
    @keyframes face{0%,100%{opacity:.84;transform:translateY(.6px)}50%{opacity:1;transform:translateY(-.6px)}}
    .edge{animation:edge 5.4s ease-in-out infinite backwards}
    @keyframes edge{0%,100%{opacity:.26}50%{opacity:.82}}
    .s2{animation-delay:.35s}
    .s3{animation-delay:.7s}
    .s4{animation-delay:1.05s}

    .spark{transform-box:fill-box;transform-origin:center;animation:spark 3.6s ease-in-out infinite}
    @keyframes spark{0%,100%{opacity:.78;transform:scale(.82) rotate(0deg)}50%{opacity:1;transform:scale(1.16) rotate(90deg)}}
    .spark-glow{transform-box:fill-box;transform-origin:center;animation:spark-glow 3.6s ease-in-out infinite}
    @keyframes spark-glow{0%,100%{opacity:.55;transform:scale(.88)}50%{opacity:1;transform:scale(1.18)}}

    @media (prefers-reduced-motion:reduce){
      *{animation:none !important}
      .edge{opacity:.5}
    }
  </style>
  <defs>
    <clipPath id="tile"><rect x="0" y="0" width="100" height="100" rx="23" ry="23"/></clipPath>
    <radialGradient id="bg" cx="32%" cy="6%" r="125%">
      <stop offset="0" stop-color="#1a1330"/>
      <stop offset="1" stop-color="#080510"/>
    </radialGradient>
    <radialGradient id="sheen" cx="30%" cy="4%" r="80%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="0.58" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gTFmark" gradientUnits="userSpaceOnUse" x1="50" y1="26" x2="50" y2="72">
      <stop offset="0" stop-color="#A96FE6"/>
      <stop offset="0.5" stop-color="#7B42BC"/>
      <stop offset="1" stop-color="#59298F"/>
    </linearGradient>
    <radialGradient id="gAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8A4FD0" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8A4FD0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D7DFEC" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#D7DFEC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="100" height="100" fill="url(#bg)"/>
    <rect x="0" y="0" width="100" height="100" fill="url(#sheen)"/>

    <ellipse class="amb" cx="50" cy="49" rx="34" ry="34" fill="url(#gAmbient)"/>

    <!-- orbit: far side (behind mark) -->
    <g transform="rotate(-14 50 53)">
      <path d="M93,53 A43,12 0 0 0 7,53" fill="none" stroke="#D7DFEC" stroke-width="1.9" stroke-linecap="round" opacity="0.38"/>
    </g>

    <!-- Terraform mark: shadow -->
    <g transform="translate(1.5,2.4)" fill="#37195C">
      <path d="M30.46,27 L30.46,41.01 L42.60,48.03 L42.60,34.01 Z"/>
      <path d="M69.54,34.82 L57.40,41.83 L57.40,55.85 L69.54,48.84 Z"/>
      <path d="M43.93,34.83 L43.93,48.84 L56.07,55.85 L56.07,41.84 Z"/>
      <path d="M43.93,49.98 L43.93,64 L56.07,71.01 L56.07,56.99 Z"/>
    </g>
    <!-- Terraform mark: faces -->
    <g fill="url(#gTFmark)">
      <path class="face" d="M30.46,27 L30.46,41.01 L42.60,48.03 L42.60,34.01 Z"/>
      <path class="face s2" d="M69.54,34.82 L57.40,41.83 L57.40,55.85 L69.54,48.84 Z"/>
      <path class="face s3" d="M43.93,34.83 L43.93,48.84 L56.07,55.85 L56.07,41.84 Z"/>
      <path class="face s4" d="M43.93,49.98 L43.93,64 L56.07,71.01 L56.07,56.99 Z"/>
    </g>
    <!-- Terraform mark: edge light -->
    <g stroke="#CBA6FF" stroke-width="1.2" stroke-linecap="round" fill="none">
      <path class="edge" d="M30.7,27.2 L42.4,34"/>
      <path class="edge s2" d="M57.6,41.7 L69.3,35"/>
      <path class="edge s3" d="M44.1,34.9 L55.9,41.7"/>
      <path class="edge s4" d="M44.1,50.1 L55.9,56.9"/>
    </g>

    <!-- orbit: near side + scintilla (in front of mark) -->
    <g transform="rotate(-14 50 53)">
      <path d="M93,53 A43,12 0 0 1 7,53" fill="none" stroke="#D7DFEC" stroke-width="3" stroke-linecap="round" opacity="0.92"/>
      <path d="M93,53 A43,12 0 0 1 7,53" fill="none" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="0.4"/>
      <path class="orbit-run" d="M93,53 A43,12 0 0 1 7,53"/>
      <circle class="spark-glow" cx="86.46" cy="46.64" r="11" fill="url(#gGlow)"/>
      <path class="spark" d="M86.46,39.5 C87.1,44.7 88.1,45.7 93,46.64 C88.1,47.6 87.1,48.6 86.46,53.8 C85.8,48.6 84.8,47.6 79.9,46.64 C84.8,45.7 85.8,44.7 86.46,39.5 Z" fill="#ffffff"/>
      <circle cx="86.46" cy="46.64" r="1.7" fill="#D7DFEC"/>
    </g>
  </g>
</svg>
